<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/mq.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>login</title>
</head>
<body>
    <main>
        <section>
            <div id="image"></div>
            <div id="form">
                <form action="cadastro.php" method="post" autocomplete="on">
                    <h1>Login</h1>
                    <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente</p>
                    <div>
                        <i class="material-icons">person</i>
                        <label for="iemail"></label>
                        <input type="email" name="email" id="iemail" placeholder="seu e-mail" autocomplete="email" maxlength="30" required>
                    </div>
                    <div>
                        <i class="material-icons">vpn_key</i>
                        <label for="isenha"></label>
                        <input type="current-password" name="senha" id="isenha" placeholder="Sua senha" autocomplete="current-password" required minlength="8"  maxlength="20">
                    </div>
                    <input id="entrar" type="submit" value="Entrar">
                    <a href="esqueci.html" id="esqueci">Esqueci a senha<i class="material-icons">email</i></a>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
